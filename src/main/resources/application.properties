# ==========================================
# Application Configuration
# ==========================================
spring.application.name=PongRank-Backend
server.port=${PORT:8080}

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pongrank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & Hibernate Settings
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# JWT Security Configuration
# ==========================================
# 256-bit base64-encoded secret key for HMAC-SHA256
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Access token validity: 24 hours (86,400,000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}
# Refresh token validity: 7 days (604,800,000 ms)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
