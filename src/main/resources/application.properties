# ==========================================
# Application Configuration
# ==========================================
spring.application.name=PongRank-Backend
server.port=${PORT:8080}

# URL del frontend (usada en links de correos: login, reset de contraseña, membresía)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# ==========================================
# Envío de correo (SMTP)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@pongrank.app}

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pongrank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & Hibernate Settings
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# JWT Security Configuration
# ==========================================
# 256-bit base64-encoded secret key for HMAC-SHA256 (REQUIRED: define JWT_SECRET in environment)
jwt.secret=${JWT_SECRET}
# Access token validity: 24 hours (86,400,000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}
# Refresh token validity: 7 days (604,800,000 ms)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# CORS Configuration
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ==========================================
# MercadoPago (Checkout Pro)
# ==========================================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY}
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:http://localhost:8080/api/v1/payments/webhook}

# Precio mensual de cada plan pagado (soles). FREEMIUM no tiene precio.
membership.basic.price=${MEMBERSHIP_BASIC_PRICE:9.90}
membership.pro.price=${MEMBERSHIP_PRO_PRICE:19.90}
membership.enterprise.price=${MEMBERSHIP_ENTERPRISE_PRICE:39.90}

# Cron del job que vence membresías pagadas cuyo endDate ya pasó (por defecto, todos los días a las 3am)
membership.expiration.cron=${MEMBERSHIP_EXPIRATION_CRON:0 0 3 * * *}

# ==========================================
# Community - límites por plan
# ==========================================
# Máximo de comunidades ACTIVE que un jugador puede crear
community.max-created.freemium=${COMMUNITY_MAX_CREATED_FREEMIUM:1}
community.max-created.basic=${COMMUNITY_MAX_CREATED_BASIC:5}
community.max-created.pro=${COMMUNITY_MAX_CREATED_PRO:8}
community.max-created.enterprise=${COMMUNITY_MAX_CREATED_ENTERPRISE:8}
# Máximo total de comunidades (creadas + unido como member) por jugador
community.max-total.freemium=${COMMUNITY_MAX_TOTAL_FREEMIUM:2}
community.max-total.basic=${COMMUNITY_MAX_TOTAL_BASIC:7}
community.max-total.pro=${COMMUNITY_MAX_TOTAL_PRO:10}
community.max-total.enterprise=${COMMUNITY_MAX_TOTAL_ENTERPRISE:10}

# ==========================================
# Club - límites por plan
# ==========================================
# Máximo de clubes que un jugador ENTERPRISE puede crear/administrar a la vez
club.max-administered.enterprise=${CLUB_MAX_ADMINISTERED_ENTERPRISE:1}

# Máximo de clubes a los que un jugador puede pertenecer en total (como admin o miembro)
club.max-total.freemium=${CLUB_MAX_TOTAL_FREEMIUM:0}
club.max-total.basic=${CLUB_MAX_TOTAL_BASIC:2}
club.max-total.pro=${CLUB_MAX_TOTAL_PRO:5}
club.max-total.enterprise=${CLUB_MAX_TOTAL_ENTERPRISE:1}

# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
