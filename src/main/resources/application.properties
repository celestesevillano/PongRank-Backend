# ==========================================
# Application Configuration
# ==========================================
spring.application.name=PongRank-Backend
server.port=${PORT:8080}

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pongrank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & Hibernate Settings
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# JWT Security Configuration
# ==========================================
# 256-bit base64-encoded secret key for HMAC-SHA256 (REQUIRED: define JWT_SECRET in environment)
jwt.secret=${JWT_SECRET}
# Access token validity: 24 hours (86,400,000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}
# Refresh token validity: 7 days (604,800,000 ms)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# CORS Configuration
# ==========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# ==========================================
# MercadoPago (Checkout Pro)
# ==========================================
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY}
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:http://localhost:8080/api/v1/payments/webhook}

# Precio mensual del plan PREMIUM (soles)
membership.premium.price=${MEMBERSHIP_PREMIUM_PRICE:19.90}

# Cron del job que vence membresías PREMIUM cuyo endDate ya pasó (por defecto, todos los días a las 3am)
membership.expiration.cron=${MEMBERSHIP_EXPIRATION_CRON:0 0 3 * * *}

# ==========================================
# Community - límites por plan
# ==========================================
# Máximo de comunidades ACTIVE que un jugador puede crear
community.max-created.freemium=${COMMUNITY_MAX_CREATED_FREEMIUM:1}
community.max-created.premium=${COMMUNITY_MAX_CREATED_PREMIUM:5}
# Máximo total de comunidades (creadas + unido como member) por jugador
community.max-total.freemium=${COMMUNITY_MAX_TOTAL_FREEMIUM:2}
community.max-total.premium=${COMMUNITY_MAX_TOTAL_PREMIUM:7}

# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
